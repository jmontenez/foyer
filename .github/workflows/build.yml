name: Tests et builds Foyer
on:
  push:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal de l’APK (le canal beta vise l’instance de validation)
        type: choice
        options: [stable, beta]
        default: stable
permissions:
  contents: read
concurrency:
  group: foyer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Tests serveur, API, Flutter et navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: foyer_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foyer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Tests serveur
        run: |
          dotnet restore server/Foyer.Tests --locked-mode
          dotnet test server/Foyer.Tests --no-restore --logger trx --results-directory artifacts/test-results
      - name: Analyse et tests Flutter
        working-directory: client
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Compiler le web et le serveur
        run: scripts/build.sh
      - name: Installer le navigateur de test
        run: |
          npm install --prefix artifacts/browser playwright@1.63.0 --no-audit --no-fund
          node artifacts/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Recette API et navigateur sur données fictives
        run: scripts/ci/integration.sh
      - name: Recette du déploiement automatique
        run: python3 scripts/tests/auto_update.py
      - name: Conserver les rapports et captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ github.run_number }}
          retention-days: 7
          path: |
            artifacts/test-results/
            artifacts/ci/
            artifacts/browser/*.png
      - name: Publier le build web
        # Builds publiés seulement pour main, redesign (canal beta), les tags v* ou un lancement manuel.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foyer-web-${{ github.run_number }}
          path: client/build/web/
          retention-days: 7
          if-no-files-found: error
  android:
    name: APK Android
    # En parallèle de la validation : la release, elle, exige les deux.
    # Les branches ne construisent pas d’APK, sauf lancement manuel (Actions → Run workflow).
    # La branche redesign construit l’APK du canal beta (« Foyer β », package .beta, API de validation).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIREBASE_ANDROID_JSON: ${{ vars.FIREBASE_ANDROID_JSON }}
      FOYER_API_URL: ${{ vars.FOYER_API_URL }}
      FOYER_BETA_API_URL: ${{ vars.FOYER_BETA_API_URL }}
      # beta : push sur redesign, ou lancement manuel avec channel=beta (test du canal sans release).
      FOYER_CHANNEL: ${{ (github.ref == 'refs/heads/redesign' || inputs.channel == 'beta') && 'beta' || 'stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      # Cache Gradle (dépendances et cache de build des modules des plugins), mis à jour
      # depuis main seulement ; en lecture seule ailleurs.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Configurer Firebase Android
        run: python3 scripts/ci/firebase.py
      - name: Restaurer les dépendances
        working-directory: client
        run: flutter pub get --enforce-lockfile
      - name: Installer la clé de signature dédiée
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foyer-release.p12"
          chmod 600 "$RUNNER_TEMP/foyer-release.p12"
      - name: Compiler l’APK signé
        working-directory: client
        env:
          FOYER_KEYSTORE: ${{ runner.temp }}/foyer-release.p12
          FOYER_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FOYER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FOYER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number=$((100 + GITHUB_RUN_NUMBER)) --dart-define-from-file=.config/android.json
      - name: Effacer la copie temporaire de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/foyer-release.p12"
      - name: Préparer la distribution
        run: |
          # Noms et package attendus selon le canal (beta = package .beta, asset distinct).
          if [ "$FOYER_CHANNEL" = beta ]; then
            apk=foyer-beta-arm64.apk expected=fr.foyer.foyer.beta
          else
            apk=foyer-arm64.apk expected=fr.foyer.foyer
          fi
          mkdir -p artifacts/android
          cp client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "artifacts/android/$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs "artifacts/android/$apk"
          cd artifacts/android
          sha256sum "$apk" > SHA256SUMS
          # Manifeste de mise à jour servi par l’API : versionCode réel lu dans l’APK
          # (--split-per-abi ajoute 1000 × ABI au numéro de build).
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          # Pas de `head` : sous pipefail, un SIGPIPE d’aapt2 ferait échouer l’étape.
          "$aapt2" dump badging "$apk" | EXPECTED_PACKAGE="$expected" APK_NAME="$apk" python3 -c '
          import hashlib, json, os, re, sys
          badging = sys.stdin.read().splitlines()[0]
          expected = "name=\x27" + os.environ["EXPECTED_PACKAGE"] + "\x27"
          assert expected in badging, badging
          data = open(os.environ["APK_NAME"], "rb").read()
          json.dump({
              "versionCode": int(re.search(r"versionCode=\x27(\d+)\x27", badging)[1]),
              "versionName": re.search(r"versionName=\x27([^\x27]+)\x27", badging)[1],
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
          }, open("foyer-android.json", "w"))'
          cat foyer-android.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foyer-android-${{ github.run_number }}
          path: artifacts/android/
          retention-days: 7
          if-no-files-found: error
  release:
    name: Release privée sur tag
    # redesign publie une prerelease beta-N : jamais déployée (le déploiement auto ne
    # retient que les tags ci-N, cf. scripts/deploy/auto_update.py), téléchargée à la main.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign'
    needs: [validation, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: foyer-android-${{ github.run_number }}
          path: distribution
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: foyer-web-${{ github.run_number }}
          path: web
      - name: Joindre le build web (déploiement automatique du serveur)
        run: |
          tar -czf distribution/foyer-web.tar.gz -C web .
          (cd distribution && sha256sum foyer-web.tar.gz >> SHA256SUMS && cat SHA256SUMS)
      - name: Publier l’APK et son empreinte
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$SOURCE_REF" == refs/tags/v* ]]; then
            release_tag="$SOURCE_REF_NAME"
          elif [[ "$SOURCE_REF" == refs/heads/redesign ]]; then
            release_tag="beta-$GITHUB_RUN_NUMBER"
          else
            release_tag="ci-$GITHUB_RUN_NUMBER"
          fi
          gh release create "$release_tag" distribution/* --target "$SOURCE_SHA" --title "Foyer $release_tag" --generate-notes --prerelease
